<!DOCTYPE html>
<html lang="vi" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - Editnhanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(63, 63, 70, 0.3);
    }
    .text-gradient {
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="h-full font-sans antialiased overflow-x-hidden flex flex-col justify-center items-center p-4 bg-zinc-950">

  <!-- Radial gradient backgrounds -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md p-8 rounded-2xl glass-card relative overflow-hidden shadow-2xl">
    
    <!-- Top icon -->
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white mb-6" id="iconWrapper">
      <i data-lucide="key-round" class="h-7 w-7" id="mainIcon"></i>
    </div>

    <!-- Header info -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold font-display text-white mb-2" id="formTitle">Đặt lại mật khẩu</h2>
      <p class="text-sm text-zinc-400" id="formSub">Nhập mật khẩu mới dài tối thiểu 8 ký tự.</p>
    </div>

    <!-- ERROR ALERT CONTAINER -->
    <div id="errorAlert" class="hidden mb-5 p-3 rounded-lg border border-rose-950/60 bg-rose-950/20 text-xs text-rose-400 flex items-start gap-2">
      <i data-lucide="alert-circle" class="h-4.5 w-4.5 shrink-0 mt-0.5"></i>
      <span id="errorMessage">Có lỗi xảy ra.</span>
    </div>

    <!-- PASSWORD RESET FORM -->
    <form id="resetForm" class="space-y-4" onsubmit="event.preventDefault(); submitNewPassword();">
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1.5 uppercase tracking-wider">Mật khẩu mới</label>
        <input type="password" id="newPassword" placeholder="Tối thiểu 8 ký tự" 
          class="w-full rounded-lg bg-zinc-950 border border-zinc-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1.5 uppercase tracking-wider">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" 
          class="w-full rounded-lg bg-zinc-950 border border-zinc-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      
      <button type="submit" 
        class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-indigo-500/10 transition-all flex items-center justify-center gap-2">
        <span>Cập nhật mật khẩu</span>
        <i data-lucide="check" class="h-4 w-4"></i>
      </button>
    </form>

    <!-- SUCCESS AREA (Initially Hidden) -->
    <div id="successArea" class="hidden text-center space-y-6">
      <p class="text-sm text-zinc-300">Mật khẩu của bạn đã được thay đổi thành công! Mọi phiên đăng nhập cũ trên thiết bị khác đều đã bị vô hiệu hóa để bảo mật.</p>
      <a href="/" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-indigo-500/10 transition-all flex items-center justify-center gap-2">
        <span>Quay lại Đăng Nhập</span>
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </a>
    </div>

  </div>

  <script>
    let resetToken = '';

    window.addEventListener('load', () => {
      lucide.createIcons();
      
      // Parse token from URL
      const urlParams = new URLSearchParams(window.location.search);
      resetToken = urlParams.get('token');
      
      if (!resetToken) {
        showError('Mã token khôi phục mật khẩu không hợp lệ hoặc thiếu. Vui lòng kiểm tra lại liên kết trong hòm thư!');
        document.getElementById('resetForm').classList.add('hidden');
      }
    });

    function showError(msg) {
      const errBox = document.getElementById('errorAlert');
      const errMsg = document.getElementById('errorMessage');
      errMsg.innerText = msg;
      errBox.classList.remove('hidden');
      lucide.createIcons();
    }

    function hideError() {
      document.getElementById('errorAlert').classList.add('hidden');
    }

    async function submitNewPassword() {
      hideError();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showError('Vui lòng nhập đầy đủ các trường thông tin!');
        return;
      }

      if (newPassword.length < 8) {
        showError('Mật khẩu phải dài tối thiểu 8 ký tự!');
        return;
      }

      if (newPassword !== confirmPassword) {
        showError('Mật khẩu xác nhận không khớp! Vui lòng nhập lại.');
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token: resetToken, newPassword })
        });
        const data = await res.json();

        if (res.status === 200 && data.success) {
          // Success sequence
          document.getElementById('resetForm').classList.add('hidden');
          document.getElementById('successArea').classList.remove('hidden');
          
          document.getElementById('formTitle').innerText = 'Thay đổi thành công!';
          document.getElementById('formSub').innerText = 'Đặt lại mật khẩu thành công.';
          
          const icon = document.getElementById('mainIcon');
          const wrapper = document.getElementById('iconWrapper');
          icon.setAttribute('data-lucide', 'badge-check');
          wrapper.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/10 text-emerald-400 mb-6";
          
          lucide.createIcons();
        } else {
          showError(data.error || 'Đặt lại mật khẩu thất bại. Token có thể đã hết hạn hoặc không hợp lệ.');
        }
      } catch (err) {
        showError('Lỗi hệ thống: Không thể kết nối tới máy chủ.');
      }
    }
  </script>
</body>
</html>
