<!DOCTYPE html>
<html lang="vi" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực Email - Editnhanh</title>

    n.queue=[];t=b.createElement(e);t.async=!0;

  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="shortcut icon" href="favicon.svg?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(63, 63, 70, 0.3);
    }
    .text-gradient {
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="h-full font-sans antialiased overflow-x-hidden flex flex-col justify-center items-center p-4 bg-zinc-950">

  <!-- Radial gradient backgrounds -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md p-8 rounded-2xl glass-card text-center relative overflow-hidden shadow-2xl">
    
    <!-- Top icon -->
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white mb-6">
      <i data-lucide="mail-check" class="h-7 w-7" id="mainIcon"></i>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold font-display text-white mb-2" id="statusTitle">Đang xác thực email...</h2>
    <p class="text-sm text-zinc-400 mb-6" id="statusSub">Vui lòng chờ trong giây lát trong khi hệ thống xác nhận tài khoản.</p>

    <!-- LOADING SPINNER -->
    <div id="loader" class="flex flex-col items-center justify-center gap-3 py-6">
      <i data-lucide="loader-2" class="h-10 w-10 text-indigo-500 animate-spin"></i>
      <span class="text-xs text-zinc-500">Đang giao tiếp với máy chủ...</span>
    </div>

    <!-- ACTION BUTTONS -->
    <div id="actionContainer" class="hidden space-y-4">
      <a href="/" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-indigo-500/10 transition-all flex items-center justify-center gap-2">
        <span>Quay lại Trang Chủ</span>
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </a>
    </div>

  </div>

  <script>
    window.addEventListener('load', async () => {
      lucide.createIcons();
      await performVerification();
    });

    async function performVerification() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const titleEl = document.getElementById('statusTitle');
      const subEl = document.getElementById('statusSub');
      const loaderEl = document.getElementById('loader');
      const actionEl = document.getElementById('actionContainer');
      const mainIconEl = document.getElementById('mainIcon');

      if (!token) {
        titleEl.innerText = 'Lỗi xác thực!';
        subEl.innerText = 'Thiếu mã token xác nhận. Vui lòng kiểm tra lại liên kết trong hòm thư.';
        loaderEl.classList.add('hidden');
        actionEl.classList.remove('hidden');
        
        mainIconEl.setAttribute('data-lucide', 'alert-circle');
        mainIconEl.parentElement.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-500/10 text-rose-500 mb-6";
        lucide.createIcons();
        return;
      }

      try {
        const res = await fetch(`/api/auth/verify-email?token=${token}`);
        const data = await res.json();

        loaderEl.classList.add('hidden');
        actionEl.classList.remove('hidden');

        if (res.status === 200 && data.success) {
          titleEl.innerText = 'Kích hoạt thành công!';
          subEl.innerText = data.message || 'Tài khoản của bạn đã được xác thực email. Bây giờ bạn có thể đăng nhập để bắt đầu sử dụng!';
          
          mainIconEl.setAttribute('data-lucide', 'badge-check');
          mainIconEl.parentElement.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/10 text-emerald-400 mb-6";
        } else {
          titleEl.innerText = 'Kích hoạt thất bại!';
          subEl.innerText = data.error || 'Token không hợp lệ, đã hết hạn, hoặc đã được sử dụng từ trước.';
          
          mainIconEl.setAttribute('data-lucide', 'alert-triangle');
          mainIconEl.parentElement.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-500/10 text-rose-400 mb-6";
        }
      } catch (err) {
        loaderEl.classList.add('hidden');
        actionEl.classList.remove('hidden');
        titleEl.innerText = 'Lỗi hệ thống!';
        subEl.innerText = 'Không thể kết nối tới máy chủ. Vui lòng kiểm tra lại kết nối mạng.';
        
        mainIconEl.setAttribute('data-lucide', 'wifi-off');
        mainIconEl.parentElement.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-zinc-800 text-zinc-400 mb-6";
      }

      lucide.createIcons();
    }
  </script>
</body>
</html>
