<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Video Studio Tools - Logs Console</title>
  <style>
    :root {
      --bg-color: #121216;
      --panel-bg: #09090b;
      --border-color: #27272a;
      --text-color: #e4e4e7;
      --time-color: #71717a;
      --info-color: #10b981;
      --warn-color: #f59e0b;
      --error-color: #ef4444;
      --btn-bg: #27272a;
      --btn-hover: #3f3f46;
      --btn-text: #f4f4f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #00d2ff;
    }

    .header-title span.pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--info-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--info-color);
      animation: pulse-anim 1.5s infinite;
    }

    @keyframes pulse-anim {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background-color: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--btn-text);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      border-color: #52525b;
    }

    .btn-danger:hover {
      background-color: #7f1d1d;
      border-color: #b91c1c;
      color: #fca5a5;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      cursor: pointer;
      font-size: 12px;
      color: #a1a1aa;
    }

    .checkbox-container input {
      cursor: pointer;
    }

    .terminal-container {
      flex-grow: 1;
      background-color: var(--panel-bg);
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    #log-display {
      min-height: 100%;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-row {
      margin-bottom: 4px;
      display: block;
    }

    .log-time {
      color: var(--time-color);
    }

    .log-level {
      font-weight: bold;
      padding: 0 4px;
      border-radius: 2px;
    }

    .log-info {
      color: var(--info-color);
    }

    .log-warn {
      color: var(--warn-color);
      background-color: rgba(245, 158, 11, 0.1);
    }

    .log-error {
      color: var(--error-color);
      background-color: rgba(239, 68, 68, 0.1);
      font-weight: bold;
    }

    .log-message {
      color: var(--text-color);
    }

    .text-muted {
      color: #52525b;
    }

    /* Tùy chỉnh thanh cuộn (scrollbar) */
    .terminal-container::-webkit-scrollbar {
      width: 10px;
    }
    .terminal-container::-webkit-scrollbar-track {
      background: var(--panel-bg);
    }
    .terminal-container::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 5px;
    }
    .terminal-container::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span class="pulse"></span>
      <span>LOGS CONSOLE</span>
    </div>
    <div class="actions">
      <label class="checkbox-container">
        <input type="checkbox" id="auto-scroll-check" checked>
        Tự động cuộn
      </label>
      <button class="btn" id="copy-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Sao chép
      </button>
      <button class="btn" id="folder-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        Mở thư mục
      </button>
      <button class="btn btn-danger" id="clear-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Xóa sạch log
      </button>
    </div>
  </header>

  <div class="terminal-container" id="terminal">
    <div id="log-display"></div>
  </div>

  <script>
    const { ipcRenderer, clipboard, shell } = require('electron');
    const fs = require('fs');

    let logFilePath = null;
    const logDisplay = document.getElementById('log-display');
    const terminalContainer = document.getElementById('terminal');
    const autoScrollCheck = document.getElementById('auto-scroll-check');

    // Hàm phân tích định dạng dòng log và đổi màu
    function formatLogLine(line) {
      if (!line.trim()) return '';
      
      // Tránh XSS
      const escaped = line
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      
      // Biểu thức chính quy tách log: [Thời gian] [Level] Nội dung
      const match = escaped.match(/^\[(.*?)\]\s+\[(.*?)\]\s+([\s\S]*)$/);
      if (match) {
        const timestamp = match[1];
        const level = match[2];
        const message = match[3];
        
        let levelClass = 'log-info';
        if (level === 'ERROR') levelClass = 'log-error';
        else if (level === 'WARN') levelClass = 'log-warn';
        
        return `<div class="log-row"><span class="log-time">[${timestamp}]</span> <span class="log-level ${levelClass}">[${level}]</span> <span class="log-message">${message}</span></div>`;
      }
      return `<div class="log-row text-muted">${escaped}</div>`;
    }

    // Hàm cuộn màn hình xuống cuối
    function scrollToBottom() {
      if (autoScrollCheck.checked) {
        terminalContainer.scrollTop = terminalContainer.scrollHeight;
      }
    }

    // Yêu cầu Main Process gửi đường dẫn log file
    ipcRenderer.send('request-log-path');

    ipcRenderer.on('log-path-response', (event, path) => {
      logFilePath = path;
      loadAllLogs();
    });

    // Hàm tải và đọc file log ban đầu
    function loadAllLogs() {
      if (!logFilePath) return;
      try {
        if (fs.existsSync(logFilePath)) {
          const rawContent = fs.readFileSync(logFilePath, 'utf8');
          const lines = rawContent.split('\n');
          const htmlLines = lines.map(line => formatLogLine(line)).join('');
          logDisplay.innerHTML = htmlLines;
          scrollToBottom();
        }
      } catch (err) {
        logDisplay.innerHTML = `<div class="log-row log-error">Không thể đọc file log ban đầu: ${err.message}</div>`;
      }
    }

    // Nhận dòng log mới truyền trực tiếp từ IPC
    ipcRenderer.on('new-log-line', (event, line) => {
      const div = document.createElement('div');
      div.innerHTML = formatLogLine(line.trim());
      // Thêm trực tiếp phần tử con để tối ưu hiệu năng thay vì gán innerHTML
      if (div.firstElementChild) {
        logDisplay.appendChild(div.firstElementChild);
      }
      scrollToBottom();
    });

    // Nút Sao chép toàn bộ log
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (!logFilePath) return;
      try {
        if (fs.existsSync(logFilePath)) {
          const rawContent = fs.readFileSync(logFilePath, 'utf8');
          clipboard.writeText(rawContent);
          alert('Đã sao chép toàn bộ log vào Clipboard!');
        } else {
          alert('Không có nội dung log để sao chép.');
        }
      } catch (e) {
        alert('Lỗi khi sao chép log: ' + e.message);
      }
    });

    // Nút Mở thư mục chứa log
    document.getElementById('folder-btn').addEventListener('click', () => {
      if (logFilePath) {
        shell.showItemInFolder(logFilePath);
      }
    });

    // Nút Xóa sạch file log vật lý và giao diện
    document.getElementById('clear-btn').addEventListener('click', () => {
      if (!logFilePath) return;
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ file log không?')) {
        try {
          fs.writeFileSync(logFilePath, '', 'utf8');
          logDisplay.innerHTML = '<div class="log-row log-info">[HỆ THỐNG] Đã dọn dẹp sạch file log.</div>';
          scrollToBottom();
        } catch (e) {
          alert('Không thể xóa file log: ' + e.message);
        }
      }
    });
  </script>
</body>
</html>
